# Sunday — Windows packaging (Phase 7).
#
# Builds every package, runs the test suites, packages the sunday-agent
# .vsix, builds the NSIS installer .exe, and — on a version tag push
# (v0.1.0) — creates the GitHub release with both artifacts attached.
#
# Manual run: Actions tab → "windows-package" → Run workflow.

name: windows-package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create the release + upload artifacts on tags

jobs:
  # Hardening: fail the workflow if anything looking like a real credential
  # was committed to the product tree. Deliberate fixtures are excluded:
  #   - packages/skills/src/memory.ts (the secret-pattern regex definitions)
  #   - packages/skills/src/memory.test.ts (redaction test fixtures)
  #   - packages/sundayd/src/agent-tools.test.ts (remember-refusal fixture)
  # Docs must describe patterns with placeholders (e.g. github_pat_<…>)
  # so they never match.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for leaked secrets
        shell: pwsh
        run: |
          $pattern = 'github_pat_[A-Za-z0-9_]{8,}|ghp_[A-Za-z0-9]{8,}|gho_[A-Za-z0-9]{8,}|sk-[A-Za-z0-9]{8,}|xox[baprs]-[A-Za-z0-9-]{8,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |DSA |EC |OPENSSH )?PRIVATE KEY-----'
          # git grep exits 1 when nothing matches — that is the CLEAN case.
          # Capture output first, then judge by content, not by exit code.
          $hits = git grep -n -E $pattern -- packages scripts docs packaging branding .github `
            ':!packages/skills/src/memory.ts' `
            ':!packages/skills/src/memory.test.ts' `
            ':!packages/sundayd/src/agent-tools.test.ts' `
            ':!packages/mcp/src/mcp.test.ts' 2>$null
          if ($LASTEXITCODE -gt 1) {
            Write-Error "git grep errored (exit $LASTEXITCODE)"
            exit 1
          }
          if ($hits) {
            Write-Error "Secret scan failed — possible leaked credentials:`n$hits"
            exit 1
          }
          Write-Host 'Secret scan clean.'
          exit 0

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages (sequential — keeps TS memory low)
        run: pnpm -r --workspace-concurrency=1 build

      - name: Run test suites
        run: pnpm -r --workspace-concurrency=1 test

      - name: Relay matrix (§24.3) — release evidence
        run: |
          cd packages/gateway
          # NO_COLOR: vitest ANSI codes break the grep check below.
          # PowerShell syntax ($env:) — this workflow runs on Windows.
          $env:NO_COLOR = "1"
          npx vitest run src/relay-matrix.test.ts --reporter=verbose 2>&1 | tee relay-matrix-report.txt
          echo "--- relay matrix: all tests must pass ---"
          grep -q "Test Files  1 passed" relay-matrix-report.txt

      - name: Upload relay matrix report
        uses: actions/upload-artifact@v4
        with:
          name: relay-matrix-report
          path: packages/gateway/relay-matrix-report.txt

      - name: Install vsce
        run: npm i -g @vscode/vsce

      - name: Package .vsix
        run: node scripts/package-vsix.mjs --out dist-package

      - name: Electron smoke test (VS Code + VSIX) — release evidence
        # TODO(smoke-hang): Disabled 2026-10-05 — hangs indefinitely on
        # windows-latest runners (20+ min, no output). Re-enable after
        # investigating scripts/smoke/src/run.mjs hang. Tracks: Build gate #1.
        if: false
        run: |
          $version = (node -p "require('./packages/ext-agent/package.json').version")
          cd scripts/smoke
          npm install --no-audit --no-fund
          node src/run.mjs --vsix ../../dist-package/sunday-agent-$version.vsix
        # Windows runners have a display; Linux would need xvfb-run -a.

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $version = (node -p "require('./packages/ext-agent/package.json').version")
          $vsix = "sunday-agent-$version.vsix"
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/DVERSION=$version" "/DVSIX=${{ github.workspace }}\dist-package\$vsix" "/DOUTFILE=${{ github.workspace }}\Sunday-Agent-Setup-$version.exe" packaging/windows/sunday.nsi
          echo "SUNDAY_VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sunday-windows-${{ env.SUNDAY_VERSION }}
          path: |
            dist-package/*.vsix
            Sunday-Agent-Setup-*.exe

      - name: Attach artifacts to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:SUNDAY_VERSION
          $tag = $env:GITHUB_REF_NAME
          $vsix = "dist-package/sunday-agent-$version.vsix"
          $exe = "Sunday-Agent-Setup-$version.exe"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # Release already exists (e.g. created manually) — just upload.
            gh release upload $tag --clobber $vsix $exe
          } else {
            gh release create $tag `
              --title "Sunday $version" `
              --notes-file CHANGELOG.md `
              $vsix $exe
          }
