# Sunday — full branded IDE build (fork build).
#
# Builds the complete Sunday desktop IDE from the vendored VS Code tree
# (vscode/, pinned in vscode/SUNDAY_UPSTREAM.md) on GitHub Actions runners.
# Standard runners have 16GB RAM, which is enough for the full Code-OSS
# build — this is the same approach VSCodium uses.
#
# Triggers:
#   - Manual: Actions tab → "Sunday IDE" → Run workflow.
#   - Release: push a tag like `ide-v0.2.0`. The `v*` tag line is owned by
#     windows-package.yml (extension-only release); `ide-v*` keeps the two
#     release lines distinct. On `ide-v*` the built installers are attached
#     to the GitHub release for that tag.
#
# Pipeline per OS leg (windows x64 / linux x64 / macOS arm64):
#   1. pnpm install + sequential product build + tests (root workspace)
#   2. node scripts/package-vsix.mjs → sunday-agent VSIX + sidecar bundles
#   3. npm ci inside vscode/  (upstream uses npm, NOT pnpm, for the fork)
#   4. bash scripts/sync-builtin.sh → copies the built sunday-agent
#      extension into vscode/extensions/ as a built-in extension
#      (branding via product.json/resources is already in-tree: P-001/P-002)
#   5. npm run gulp core-ci                      → typecheck + esbuild bundles
#   6. npm run gulp vscode-<platform>-<arch>-min-ci → packaged client dir
#   7. OS installer: Inno Setup .exe (win) / tar.gz (linux) / .dmg (macOS)
#
# Gulp targets chosen (vscode/build/gulpfile.vscode*.ts + upstream
# azure-pipelines product-build-*-compile.yml):
#   - core-ci: tsgo typecheck, transpile to out-build, esbuild min bundles
#     (out-vscode-min, out-vscode-reh-min, out-vscode-reh-web-min). This is
#     what upstream's own CI runs before packaging.
#   - vscode-<platform>-<arch>-min-ci: the full "-min" task does
#     copyCodicons + extension compile + esbuildBundle + package; the "-ci"
#     suffix skips the bundle step because core-ci already produced it.
#     We build ONLY the desktop client here (no -reh server / -reh-web):
#     the IDE release is the desktop app. Server builds can be added later
#     via vscode-reh-<platform>-<arch>-min-ci if remote dev is needed.
#   - win32 only: vscode-win32-x64-inno-updater (auto-update helper),
#     then vscode-win32-x64-system-setup / vscode-win32-x64-user-setup
#     (Inno Setup installers via the `innosetup` npm package — no choco
#     needed, unlike windows-package.yml's standalone NSIS step).
#   - darwin only: build/darwin/create-dmg.ts (clones dmgbuild, needs
#     network + python3, both present on macos runners).
#   - linux only: plain tar.gz of the client dir (upstream does the same
#     before deb/rpm; deb/rpm/snap packaging is future work).
#
# Hard-won fixes carried over from windows-package.yml:
#   - pnpm install --frozen-lockfile (never plain `pnpm install`)
#   - pnpm -r --workspace-concurrency=1 build/test (sequential; parallel
#     tsc OOMs on small machines and is pointless on the big steps anyway)
#   - node 24.18.0 from vscode/.nvmrc for the whole job (vscode's preinstall
#     script enforces the .nvmrc version; product packages build fine on 24)
#   - esbuild .bin / .cmd shim issue: never invoke esbuild/vsce CLIs via
#     shell shims — scripts/package-vsix.mjs already uses the esbuild JS API
#     and spawns vsce with shell:true on Windows
#   - CRLF: vscode/.gitattributes pins *.sh to LF; root scripts are invoked
#     explicitly via `bash` (Git Bash on Windows)
#   - absolute paths for installer outputs (no relative-path surprises)
#
# TODO(signing): no certificates are available in this repo, so all
# installers ship UNSIGNED. Hook signing in at the marked spots when certs
# exist:
#   - win32: pass `--sign` to the gulp setup tasks + wire ESRP/signer
#   - darwin: codesign the .app + `xcrun notarytool` before/after DMG —
#     unsigned DMGs trigger Gatekeeper warnings on first launch
#   - linux: tarball needs no signing; sign .deb/.rpm if those are added

name: Sunday IDE

on:
  workflow_dispatch:
  push:
    tags:
      - 'ide-v*'

permissions:
  contents: write # create releases + upload artifacts on tags

# Never cancel a 30-60+ min IDE build because a newer commit landed.
concurrency:
  group: sunday-ide-${{ github.ref }}
  cancel-in-progress: false

# Git Bash everywhere: uniform tee/pipefail/glob behavior on all three OSes.
defaults:
  run:
    shell: bash

jobs:
  # Hardening: fail the workflow if anything looking like a real credential
  # was committed to the product tree. Same exclusions as windows-package.yml.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for leaked secrets
        shell: pwsh
        run: |
          $pattern = 'github_pat_[A-Za-z0-9_]{8,}|ghp_[A-Za-z0-9]{8,}|gho_[A-Za-z0-9]{8,}|sk-[A-Za-z0-9]{8,}|xox[baprs]-[A-Za-z0-9-]{8,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |DSA |EC |OPENSSH )?PRIVATE KEY-----'
          # git grep exits 1 when nothing matches — that is the CLEAN case.
          # Capture output first, then judge by content, not by exit code.
          $hits = git grep -n -E $pattern -- packages scripts docs packaging branding .github `
            ':!packages/skills/src/memory.ts' `
            ':!packages/skills/src/memory.test.ts' `
            ':!packages/sundayd/src/agent-tools.test.ts' 2>$null
          if ($LASTEXITCODE -gt 1) {
            Write-Error "git grep errored (exit $LASTEXITCODE)"
            exit 1
          }
          if ($hits) {
            Write-Error "Secret scan failed — possible leaked credentials:`n$hits"
            exit 1
          }
          Write-Host 'Secret scan clean.'
          exit 0

  # Hardening: scan dependencies against the OSV advisory database.
  # Scans pnpm-lock.yaml (product packages) for known vulnerabilities.
  # TODO(security-gate): flip continue-on-error to false (blocking) after
  # one green run confirms no false positives — see gate #5 in
  # docs/RELEASE_GATES.md.
  advisory-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Scan lockfile with OSV-Scanner
        uses: google/osv-scanner-action@v2
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --format=sarif
            --output=osv-results.sarif
          # Fail on High/Critical once blocking (see TODO above).
          # For now, report-only: the SARIF output is uploaded below.

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

  # Creates the GitHub release for `ide-v*` tags BEFORE the matrix starts, so
  # the three OS jobs can upload concurrently without racing `release create`.
  # No-op on workflow_dispatch runs (the job itself never skips, so `needs`
  # stays satisfied).
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/ide-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#ide-v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" \
              --title "Sunday IDE $version" \
              --notes "Sunday IDE $version — full branded desktop build (Windows x64, Linux x64, macOS arm64) with the sunday-agent extension built in. Installers are unsigned (see TODO(signing) in sunday-ide.yml)."
          fi

  build-ide:
    needs: [secret-scan, prepare-release]
    timeout-minutes: 180 # the full Code-OSS build takes 30-60+ min
    strategy:
      fail-fast: false # let all three OSes report independently
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            gulp_client: vscode-win32-x64-min-ci
          - os: ubuntu-latest
            platform: linux
            arch: x64
            gulp_client: vscode-linux-x64-min-ci
          - os: macos-latest # arm64 runner
            platform: darwin
            arch: arm64
            gulp_client: vscode-darwin-arm64-min-ci
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9 # matches pnpm-lock.yaml lockfileVersion 9.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: 'vscode/.nvmrc' # 24.18.0; vscode preinstall enforces it
          cache: pnpm

      # Straightforward cache for the fork's npm tree (upstream uses npm,
      # NOT pnpm, inside vscode/). Keyed on the lockfile hash.
      - name: Cache vscode npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: sunday-ide-npm-${{ runner.os }}-${{ hashFiles('vscode/package-lock.json') }}
          restore-keys: |
            sunday-ide-npm-${{ runner.os }}-

      - name: Install product dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all product packages (sequential — keeps TS memory low)
        run: pnpm -r --workspace-concurrency=1 build

      - name: Run product test suites
        run: pnpm -r --workspace-concurrency=1 test

      - name: Install vsce
        run: npm i -g @vscode/vsce

      - name: Package sunday-agent VSIX + sidecar bundles
        run: node scripts/package-vsix.mjs --out dist-package

      - name: Read Sunday version
        run: |
          version="$(node -p "require('./packages/ext-agent/package.json').version")"
          echo "SUNDAY_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building Sunday $version"

      # Upstream installs the fork with npm ci (npm, not pnpm). Skip the
      # electron/playwright binary downloads here — the gulp packaging step
      # fetches Electron itself via build/lib/electron.ts.
      # Linux needs system headers for native modules (kerberos → gssapi,
      # node-pty → build tools). Upstream VS Code CI installs the same set.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libkrb5-dev libsecret-1-dev libx11-dev libxkbfile-dev
      # vscode/build/npm/postinstall.ts symlinks .claude/CLAUDE.md ->
      # .github/copilot-instructions.md (and .claude/skills -> .agents/skills).
      # .github/ was deliberately excluded from the vendor copy (see
      # vscode/SUNDAY_UPSTREAM.md), so stub the files postinstall stats.
      # This is CI scaffolding only — no upstream files are modified.
      - name: Stub upstream files excluded from vendor copy
        run: |
          mkdir -p vscode/.github vscode/.agents/skills
          touch vscode/.github/copilot-instructions.md
      - name: Install vscode dependencies (npm ci)
        working-directory: vscode
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          # @vscode/ripgrep postinstall downloads its binary via api.github.com;
          # unauthenticated CI IPs get 403 rate limits. The automatic token
          # (1000 req/hr) avoids it — the script reads process.env.GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      # Copies the built sunday-agent extension (dist + webviews + sidecars)
      # into vscode/extensions/ as a built-in extension. Depends on Worker 2's
      # rewritten scripts/sync-builtin.sh; must run BEFORE `gulp core-ci`
      # because the extension compile step picks up vscode/extensions/*/.
      - name: Sync built-in sunday-agent extension into the fork
        run: bash scripts/sync-builtin.sh --vsix "dist-package/sunday-agent-$SUNDAY_VERSION.vsix" --fork "$GITHUB_WORKSPACE/vscode"

      - name: Install copilot extension dependencies
        # The built-in copilot extension has its own lockfile; its
        # @github/copilot SDK must be present for the packaging shim
        # (prepareBuiltInCopilotRipgrepShim). Upstream installs it via
        # `npm run copilot:setup`; plain npm ci suffices for the shim.
        # The root postinstall already ran this once and left BROKEN
        # .claude symlinks (target vscode/extensions/copilot/.github/…
        # does not exist); its existsSync guard misses broken links, so
        # a second postinstall dies with EEXIST. Clear .claude first.
        working-directory: vscode/extensions/copilot
        run: |
          rm -rf .claude
          npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure copilot SDK dir for packaging shim
        # prepareBuiltInCopilotRipgrepShim (run during `gulp vscode-*-min-ci`)
        # requires extensions/copilot/node_modules/@github/copilot/sdk/ to
        # exist in the PACKAGED app. Two gaps: (1) the @github/copilot npm
        # package does not ship a sdk/ dir (it's populated by the shim), and
        # (2) vscode/build/.moduleignore excludes `@github/copilot/**` from
        # the packaged extension. Fix both at workflow time (no vscode/
        # core changes committed): create the dir, and re-include it via a
        # `!` negation in .moduleignore (cleanNodeModules treats `!`-lines
        # as re-includes).
        run: |
          sdk_dir="vscode/extensions/copilot/node_modules/@github/copilot/sdk"
          mkdir -p "$sdk_dir"
          # Minimal package.json so the dir is a valid package root if probed.
          if [ ! -f "vscode/extensions/copilot/node_modules/@github/copilot/package.json" ]; then
            echo '{"name":"@github/copilot","version":"0.0.0-stub"}' > "vscode/extensions/copilot/node_modules/@github/copilot/package.json"
          fi
          grep -q '^!@github/copilot/sdk/' vscode/build/.moduleignore || \
            echo '!@github/copilot/sdk/**' >> vscode/build/.moduleignore
          echo "copilot sdk dir ready: $sdk_dir"

      # Upstream's own compile step: tsgo typecheck + transpile to out-build
      # + esbuild min bundles (out-vscode-min …). Output is tee'd to the
      # per-OS build log; pipefail keeps gulp failures fatal through tee.
      # GITHUB_TOKEN: the build fetches vscode-js-debug via api.github.com;
      # unauthenticated CI IPs get 403 rate limits (run 37137724324, macOS).
      - name: Compile client (gulp core-ci)
        working-directory: vscode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npm run gulp core-ci 2>&1 | tee -a "$GITHUB_WORKSPACE/build-${{ matrix.platform }}-${{ matrix.arch }}.log"

      # Packages ../VSCode-<platform>-<arch> (sibling of vscode/, i.e. at the
      # repo root of the checkout). The -min-ci variant reuses the bundles
      # from core-ci instead of rebuilding them.
      - name: Package desktop client
        working-directory: vscode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npm run gulp ${{ matrix.gulp_client }} 2>&1 | tee -a "$GITHUB_WORKSPACE/build-${{ matrix.platform }}-${{ matrix.arch }}.log"

      # Sanity gate before spending time on installers: the client dir must
      # exist with a branded product.json.
      - name: Verify packaged client
        run: |
          client_dir="$GITHUB_WORKSPACE/VSCode-${{ matrix.platform }}-${{ matrix.arch }}"
          test -f "$client_dir/resources/app/product.json"
          app_name="$(node -p "require(process.argv[1]).applicationName" "$client_dir/resources/app/product.json")"
          echo "packaged client OK: $client_dir (applicationName=$app_name)"

      # ---- Windows: Inno Setup installers (system + user) ----
      # inno ISCC.exe comes from the `innosetup` npm package (installed via
      # npm ci) — no choco install needed. Output .exe names are renamed to
      # Sunday branding here (code.iss still emits VSCodeSetup.exe).
      # TODO(signing): pass --sign to these gulp tasks and wire the ESRP /
      # self-hosted signer when certificates exist; ship unsigned until then.
      - name: Build Windows installers (Inno Setup)
        if: matrix.platform == 'win32'
        working-directory: vscode
        run: |
          set -o pipefail
          npm run gulp vscode-win32-x64-inno-updater 2>&1 | tee -a "$GITHUB_WORKSPACE/build-win32-x64.log"
          npm run gulp vscode-win32-x64-system-setup 2>&1 | tee -a "$GITHUB_WORKSPACE/build-win32-x64.log"
          npm run gulp vscode-win32-x64-user-setup 2>&1 | tee -a "$GITHUB_WORKSPACE/build-win32-x64.log"
          sys_exe=(.build/win32-x64/system-setup/*.exe)
          usr_exe=(.build/win32-x64/user-setup/*.exe)
          mv "${sys_exe[0]}" "$GITHUB_WORKSPACE/SundaySetup-x64-$SUNDAY_VERSION.exe"
          mv "${usr_exe[0]}" "$GITHUB_WORKSPACE/SundayUserSetup-x64-$SUNDAY_VERSION.exe"
          ls -la "$GITHUB_WORKSPACE"/Sunday*.exe

      # ---- Linux: portable tarball of the client dir ----
      - name: Archive Linux client (tar.gz)
        if: matrix.platform == 'linux'
        run: |
          tar -czf "$GITHUB_WORKSPACE/sunday-linux-x64-$SUNDAY_VERSION.tar.gz" \
            -C "$GITHUB_WORKSPACE" VSCode-linux-x64
          ls -la "$GITHUB_WORKSPACE"/sunday-linux-*.tar.gz

      # ---- macOS: DMG via build/darwin/create-dmg.ts ----
      # Clones dmgbuild from GitHub into a venv; needs network + python3
      # (both present on macos runners). Emits VSCode-darwin-arm64.dmg;
      # renamed to Sunday branding here.
      # TODO(signing): codesign the .app bundle + notarize with
      # `xcrun notarytool` before creating the DMG when an Apple Developer
      # certificate exists — unsigned DMGs trigger Gatekeeper warnings.
      - name: Build macOS DMG
        if: matrix.platform == 'darwin'
        working-directory: vscode
        run: |
          set -o pipefail
          node build/darwin/create-dmg.ts "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/dmg-out" 2>&1 | tee -a "$GITHUB_WORKSPACE/build-darwin-arm64.log"
          mv "$GITHUB_WORKSPACE/dmg-out/VSCode-darwin-arm64.dmg" \
             "$GITHUB_WORKSPACE/Sunday-darwin-arm64-$SUNDAY_VERSION.dmg"
          ls -la "$GITHUB_WORKSPACE"/Sunday-darwin-*.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sunday-ide-${{ matrix.platform }}-${{ matrix.arch }}-${{ env.SUNDAY_VERSION }}
          path: |
            SundaySetup-*.exe
            SundayUserSetup-*.exe
            sunday-linux-*.tar.gz
            Sunday-darwin-*.dmg
            dist-package/*.vsix
            build-${{ matrix.platform }}-${{ matrix.arch }}.log
          if-no-files-found: error

      - name: Attach artifacts to release (tags only)
        if: startsWith(github.ref, 'refs/tags/ide-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # nullglob: only the patterns matching this OS leg's files expand.
          # The vsix is identical on all legs; --clobber makes re-uploads safe.
          shopt -s nullglob
          files=(SundaySetup-*.exe SundayUserSetup-*.exe sunday-linux-*.tar.gz Sunday-darwin-*.dmg dist-package/sunday-agent-*.vsix)
          gh release upload "$GITHUB_REF_NAME" --clobber "${files[@]}"
