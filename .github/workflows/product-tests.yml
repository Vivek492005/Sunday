# Fast cross-platform product tests.
# Runs `pnpm -r test` on Linux, macOS AND Windows for every push/PR.
# This catches Windows-incompatible tests in ~5 minutes instead of waiting
# for the 40-minute full IDE build in sunday-ide.yml.
name: Product tests (all platforms)

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all product packages (sequential — keeps TS memory low)
        run: pnpm -r --workspace-concurrency=1 build

      - name: Run product test suites
        run: pnpm -r --workspace-concurrency=1 test
